<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .app-container {
            min-height: 100vh;
        }

        #login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #map-container {
            width: 100%;
            min-height: 500px;
            background: white;
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .08);
        }

        #turkey-map {
            width: 100%;
            height: auto;
            display: block;
        }

        #turkey-map path {
            fill: #dee2e6;
            stroke: #ffffff;
            stroke-width: .8;
            cursor: pointer;
            transition: fill .2s ease;
        }

        #turkey-map g.visited path {
            fill: #198754 !important;
        }

        .stat-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 .25rem .75rem rgba(0, 0, 0, .08);
        }

        .map-tooltip {
            position: absolute;
            z-index: 1000;
            display: none;
            max-width: 280px;
            background: #212529;
            color: white;
            padding: 12px 15px;
            border-radius: .75rem;
            font-size: .9rem;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .25);
        }

        @media(max-width:768px) {
            #map-container {
                padding: .5rem;
                border-radius: .75rem;
            }
        }
    </style>
</head>

<body>
    <div id="login-screen" class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <input id="password-input" type="password" class="form-control form-control-lg mb-3"
                            placeholder="parola">
                        <button id="login-button" class="btn btn-primary w-100"> giriş </button>
                        <div id="login-error" class="text-danger text-center mt-3"> </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="app-content" class="container-xxl py-4 app-container" style="display:none">
        <div class="row mb-4">
            <div class="col">
                <div class="card stat-card">
                    <div class="card-body">
                        <h1 class="h3 mb-3">
                            <img src="https://raw.githubusercontent.com/hareketiseverim/data/refs/heads/main/marty/img/marty.png"
                                style="width:40px;border-radius:50%;margin-right:10px">
                            marty
                        </h1>
                        <div class="row g-3">
                            <div class="col-6 col-md-3">
                                <div class="text-muted small"> Toplam İl </div>
                                <div class="fs-4 fw-bold" id="total-province"> 81 </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="text-muted small"> Ziyaret Edilen </div>
                                <div class="fs-4 fw-bold text-success" id="visited-count"> 0 </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="text-muted small"> Kalan </div>
                                <div class="fs-4 fw-bold text-secondary" id="remaining-count"> 81 </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="text-muted small"> Tamamlanma </div>
                                <div class="fs-4 fw-bold text-primary" id="percentage"> %0 </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div id="map-container">
                    <div id="turkey-map"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="map-tooltip" class="map-tooltip"> </div>
    <script>
        const CONFIG = {
            password: "1",
            jsonUrl: "https://raw.githubusercontent.com/hareketiseverim/data/refs/heads/main/marty/marty.json",
            useDummyData: false,
            dummyData: [
                {
                    id: "34",
                    name: "İstanbul",
                    visited: true,
                    date: "2024-05-12",
                    note: ["İş gezisi", "Arkadaş ziyareti"]
                },
                {
                    id: "06",
                    name: "Ankara",
                    visited: true,
                    date: "2023-11-08",
                    note: ["İş toplantısı"]
                },
                {
                    id: "35",
                    name: "İzmir",
                    visited: true,
                    date: "2025-04-20",
                    note: ["Hafta sonu tatili"]
                },
                {
                    id: "07",
                    name: "Antalya",
                    visited: false,
                    date: "",
                    note: []
                }
            ]
        };
        const APP_STATE = {
            provinces: [],
            visitedCount: 0,
            mapLoaded: false
        };
        async function loadProvinceData() {
            if (CONFIG.useDummyData) {
                return CONFIG.dummyData;
            }
            try {
                const response = await fetch(CONFIG.jsonUrl);
                if (!response.ok) {
                    throw new Error("JSON yüklenemedi");
                }
                return await response.json();
            }
            catch (error) {
                console.error(error);
                return [];
            }
        }
        function prepareProvinceData(data) {
            APP_STATE.provinces = data.map(item => ({
                id: String(item.id).padStart(2, "0"),
                name: item.name || "",
                visited: Boolean(item.visited),
                date: item.date || "",
                note: item.note || []
            }));
            APP_STATE.visitedCount = APP_STATE.provinces.filter(item => item.visited).length;
        }
        function updateStatistics() {
            const visited = APP_STATE.visitedCount;
            document.getElementById("visited-count").textContent = visited;
            document.getElementById("remaining-count").textContent = 81 - visited;
            document.getElementById("percentage").textContent = "%" + Math.round((visited / 81) * 100);
        }
        async function loadTurkeyMap() {
            const svgText = await fetch("https://raw.githubusercontent.com/hareketiseverim/data/refs/heads/main/marty/img/turkey.svg").then(response => response.text());
            const container = document.getElementById("turkey-map");
            container.innerHTML = svgText;
            const svg = container.querySelector("svg");
            svg.id = "turkey-map-svg";
            svg.removeAttribute("width");
            svg.removeAttribute("height");
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        }
        function getProvinceElements() {
            const svg = document.getElementById("turkey-map-svg");
            if (!svg) { return []; }
            return [...svg.querySelectorAll("g[data-city-code]")];
        }
        function findProvinceData(element) {
            const cityCode = element.getAttribute("data-city-code");
            return APP_STATE.provinces.find(province => province.id === cityCode);
        }
        function paintMap() {
            const elements = getProvinceElements();
            elements.forEach(element => {
                const province = findProvinceData(element);
                if (province && province.visited) {
                    element.classList.add("visited");
                }
            });
        }
        const tooltip = document.getElementById("map-tooltip");
        function showTooltip(event, province) {
            let html = `
                <div class="fw-bold mb-1">${province.name}</div>
            `;
            if (province.visited) {
                html += `
                    <div class="text-success">
                    <i class="bi bi-check-circle-fill"></i>
                    Ziyaret edildi
                    </div>
                `;
                if (province.date) {
                    html += `
                        <div class="mt-2">
                            <small>
                                <i class="bi bi-calendar-event"></i> ${province.date}
                            </small>
                        </div>
                    `;
                }
                if (province.note.length > 0) {
                    html += `
                        <div class="mt-2">
                            <small>${province.note.join(" <br> ")}</small>
                        </div>
                    `;
                }
            }
            else {
                html += `
                <div class="text-secondary">
                    Henüz ziyaret edilmedi
                </div>
                `;
            }
            tooltip.innerHTML = html;
            tooltip.style.display = "block";
            moveTooltip(event);
        }
        function moveTooltip(event) {
            tooltip.style.left = (event.pageX + 15) + "px";
            tooltip.style.top = (event.pageY + 15) + "px";
        }
        function hideTooltip() {
            tooltip.style.display = "none";
        }
        function bindMapEvents() {
            const elements = getProvinceElements();
            elements.forEach(element => {
                const province = findProvinceData(element);
                const data = province || {
                    name: element.getAttribute("data-city-name"),
                    visited: false,
                    date: "",
                    note: []
                };
                element.addEventListener("mouseenter", event => {
                    showTooltip(event, data);
                });
                element.addEventListener("mousemove", moveTooltip);
                element.addEventListener("mouseleave", hideTooltip);
            });
        }
        async function init() {
            const data = await loadProvinceData();
            prepareProvinceData(data);
            updateStatistics();
            await loadTurkeyMap();
            paintMap();
            bindMapEvents();
        }
        function checkLogin() {
            const input = document.getElementById("password-input");
            const error = document.getElementById("login-error");
            if (input.value === CONFIG.password) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-content").style.display = "block";
                init();
            }
            else {
                error.textContent = "Hatalı parola";
                input.value = "";
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("login-button").addEventListener("click", checkLogin);
            document.getElementById("password-input").addEventListener("keypress", event => {
                if (event.key === "Enter") {
                    checkLogin();
                }
            });
            document.getElementById("password-input").focus();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
